<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
</head>

<body>
    <div class="container">
        <h1 class="rock">ROCK</h1>
        <h1 class="paper">PAPER</h1>
        <h1 class="scissors">SCISSORS</h1>
    </div>
    <p>Choose your move </p>
    <div class="arrow">
        <img src="arrow.png" alt="Arrow">
    </div>
    <div class="Cards">
        <div class="CardRock">
            <p>Rock</p>
        </div>
        <div class="CardPaper">
            <p>Paper</p>
        </div>
        <div class="CardScissors">
            <p>Scissors</p>
        </div>
    </div>
    <div class="CardScore">
        <h3 class="you">YOU <h2 class="UserScore">0</h2>
        </h3>
        <h3 class="vs">VS</h3>
        <h2 class="ComputerScore">0</h2>
        <h3 class="com">COMPUTER
        </h3>
    </div>
    <div class="WhoWin">
        <div class="user">
            <h4 class="userText"> YOU</h4>
            <div class="YouWin"></div>
        </div>

        <h4 class="score">SCORE!</h4>


        <div class="computer">
            <h4 class="ComputerText">COMPUTER</h4>
            <div class="ComputerWin"></div>
        </div>
    </div>
    <div class="PlayAgain">
        <button class="restart">
            <h3>PLAY AGAIN</h3>
        </button>
    </div>

    <script src="script.js"></script>
</body>

</html>
